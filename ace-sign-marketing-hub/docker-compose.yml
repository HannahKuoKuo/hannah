services:
  postgres:
    image: postgres:16-alpine
    container_name: acesign-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: acesign
      POSTGRES_PASSWORD: acesign_local_only
      POSTGRES_DB: acesign_hub
    ports:
      - "5432:5432"
    volumes:
      - acesign_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acesign -d acesign_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  acesign_pgdata:
